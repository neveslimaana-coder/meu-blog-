<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioMundo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #E8F5E9;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: white;
            color: #1B5E20;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        article {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            align-items: center;
        }

        img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }

        h2 {
            color: #1565C0;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .artigo-autor {
            font-weight: bold;
            margin: 4px 0;
        }

        button {
            background-color: #E8F5E9;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <header>
        <h1>🧬 BioMundo</h1>
        <p>Aprendendo biologia de forma leve, divertida e cheia de curiosidades!</p>
    </header>
    <main>
        <article>
            <img src="imagem-blog.png"
                alt="Ícone decorativo de biologia representando o post de apresentação do BioMundo.">
            <div>
                <h2>Bem-vindos ao BioMundo!</h2>
                <p class="artigo-autor">Por: Ana</p>
                <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar conteúdos incríveis sobre biologia de um jeito simples e descontraído. 🌿🔬</p>
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </article>
